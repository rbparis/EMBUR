name: Production uptime

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: embur-production-uptime
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify EMBUR production readiness
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            --retry 2 \
            --retry-all-errors \
            https://getembur.com/api/health)"
          node -e '
            const payload = JSON.parse(process.argv[1]);
            if (payload.status !== "ok") throw new Error(`health status: ${payload.status}`);
            if (payload.database !== "connected") throw new Error(`database: ${payload.database}`);
            if (!payload.scheduler?.ready) throw new Error("scheduler is not ready");
            if (payload.scheduler?.stale) throw new Error("scheduler heartbeat is stale");
            if (payload.scheduler?.lastError) throw new Error(`scheduler error: ${payload.scheduler.lastError}`);
          ' "$response"
